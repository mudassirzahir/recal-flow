name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify quality gates
        run: |
          npm run typecheck
          npm run lint:code
          npm test
          npm run build

      - name: Package production artifact
        run: tar -czf recallflow-dist-${{ github.ref_name }}.tar.gz dist package.json .env.example

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: recallflow-dist-${{ github.ref_name }}
          path: recallflow-dist-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: recallflow-dist-${{ github.ref_name }}.tar.gz
